name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Root tests
        run: node --test test/*.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/ds-headbot-feishu/package-lock.json
      - name: Install Feishu bridge dependencies
        working-directory: plugins/ds-headbot-feishu
        run: npm ci
      - name: Feishu bridge build and test
        working-directory: plugins/ds-headbot-feishu
        run: npm test
